<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Teknik Komputer Jaringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f7;
  --kartu: #ffffff;
  --teks: #14213d;
  --teks-redup: #5b667a;
  --garis: #d6dde8;
  --aksen: #7f52b0;
  --aksen-hover: #6b4397;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1522;
    --kartu: #172033;
    --teks: #e8edf6;
    --teks-redup: #98a4ba;
    --garis: #2a3650;
    --aksen: #a855f7;
    --aksen-hover: #9333ea;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
.wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
header p { margin: 0; color: var(--teks-redup); }
.kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.kontrol input, .kontrol select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
}
.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 160px; }
.kontrol input:focus-visible, .kontrol select:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}
.jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }
.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}
.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pita { height: 56px; background: #7f52b0; }
.isi { padding: 0 16px 16px; text-align: center; flex: 1; display: flex; flex-direction: column; }
.foto {
  width: 76px; height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #f3e8ff;
  color: #7f52b0;
  display: grid; place-items: center; font-weight: 800; font-size: 1.5rem; overflow: hidden;
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
.nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
.nis { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
.rincian { margin: 0 0 16px; text-align: left; font-size: 0.9rem; flex: 1; }
.rincian div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 0; border-top: 1px solid var(--garis);
}
.rincian dt { color: var(--teks-redup); }
.rincian dd { margin: 0; font-weight: 600; text-align: right; }
.btn-edit {
  width: 100%;
  padding: 8px 12px;
  background: var(--aksen);
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: auto;
}
.btn-edit:hover { background: var(--aksen-hover); }

.pesan { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--teks-redup); }
.pesan.galat { color: #b42318; }

/* Modal Edit Styling */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  place-items: center;
  z-index: 100;
  padding: 16px;
}
.modal.aktif { display: grid; }
.modal-konten {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  width: 100%;
  max-width: 450px;
  padding: 24px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
.modal-konten h2 { margin-top: 0; margin-bottom: 16px; font-size: 1.3rem; }
.form-grup { margin-bottom: 12px; text-align: left; }
.form-grup label { display: block; font-size: 0.85rem; color: var(--teks-redup); margin-bottom: 4px; }
.form-grup input, .form-grup select, .form-grup textarea {
  width: 100%;
  font: inherit;
  color: var(--teks);
  background: var(--bg);
  border: 1px solid var(--garis);
  border-radius: 8px;
  padding: 8px 10px;
}
.modal-aksi { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn-batal {
  background: transparent;
  color: var(--teks-redup);
  border: 1px solid var(--garis);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
}
.btn-simpan {
  background: var(--aksen);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-weight: 600;
  cursor: pointer;
}

@media (prefers-color-scheme: dark) { .pesan.galat { color: #ff8b80; } }
</style>
</head>
<body>
<div class="wadah">
  <header>
    <h1>Teknik Komputer dan Jaringan</h1>
    <p>Cari berdasarkan role.</p>
  </header>
  <div class="kontrol">
    <input id="cari" type="search" placeholder="Cari nama atau NIS" aria-label="Cari nama atau NIS">
    <select id="filterKelas" aria-label="Filter kelas">
      <option value="">Semua kelas</option>
    </select>
  </div>
  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>
</div>

<!-- MODAL EDIT SISWA -->
<div id="modalEdit" class="modal">
  <div class="modal-konten">
    <h2>Edit Data Siswa</h2>
    <form id="formEdit">
      <input type="hidden" id="editNisLama">
      <div class="form-grup">
        <label for="editNama">Nama Siswa</label>
        <input type="text" id="editNama" required>
      </div>
      <div class="form-grup">
        <label for="editKelas">Kelas</label>
        <input type="text" id="editKelas" required>
      </div>
      <div class="form-grup">
        <label for="editJenisKelamin">Jenis Kelamin</label>
        <select id="editJenisKelamin">
          <option value="L">Laki-laki (L)</option>
          <option value="P">Perempuan (P)</option>
        </select>
      </div>
      <div class="form-grup">
        <label for="editTanggalLahir">Tanggal Lahir</label>
        <input type="date" id="editTanggalLahir">
      </div>
      <div class="form-grup">
        <label for="editAlamat">Alamat</label>
        <textarea id="editAlamat" rows="2"></textarea>
      </div>
      <div class="form-grup">
        <label for="editFotoUrl">URL Foto</label>
        <input type="url" id="editFotoUrl" placeholder="https://...">
      </div>
      <div class="modal-aksi">
        <button type="button" class="btn-batal" onclick="tutupModal()">Batal</button>
        <button type="submit" class="btn-simpan">Simpan</button>
      </div>
    </form>
  </div>
</div>
