<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Teknik Komputer Jaringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f7;
  --kartu: #ffffff;
  --teks: #14213d;
  --teks-redup: #5b667a;
  --garis: #d6dde8;
  --aksen: #7f52b0;
  --bahaya: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1522;
    --kartu: #172033;
    --teks: #e8edf6;
    --teks-redup: #98a4ba;
    --garis: #2a3650;
    --aksen: #a855f7;
    --bahaya: #ff8b80;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
.wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
header p { margin: 0; color: var(--teks-redup); }
.btn-tambah {
  background: var(--aksen);
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}
.kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.kontrol input, .kontrol select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
}
.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 160px; }
.kontrol input:focus-visible, .kontrol select:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}
.jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }
.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}
.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pita { height: 56px; background: #7f52b0; }
.isi { padding: 0 16px 16px; text-align: center; flex: 1; display: flex; flex-direction: column; }
.foto {
  width: 76px; height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #f3e8ff;
  color: #7f52b0;
  display: grid; place-items: center; font-weight: 800; font-size: 1.5rem; overflow: hidden;
  flex-shrink: 0;
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
.nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
.nis { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
.rincian { margin: 0 0 16px; text-align: left; font-size: 0.9rem; flex: 1; }
.rincian div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 0; border-top: 1px solid var(--garis);
}
.rincian dt { color: var(--teks-redup); }
.rincian dd { margin: 0; font-weight: 600; text-align: right; }
.kartu-aksi {
  display: flex;
  gap: 8px;
  padding: 0 16px 16px;
}
.kartu-aksi button {
  flex: 1;
  padding: 6px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-edit { background: transparent; border: 1px solid var(--garis); color: var(--teks); }
.btn-hapus { background: transparent; border: 1px solid var(--bahaya); color: var(--bahaya); }
@media (prefers-color-scheme: dark) { .btn-hapus { color: #ff8b80; } }

.pesan { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--teks-redup); }
.pesan.galat { color: var(--bahaya); }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  place-items: center;
  padding: 16px;
  z-index: 100;
}
.modal.aktif { display: grid; }
.modal-konten {
  background: var(--kartu);
  border: 1px solid var(--garis);
  padding: 24px;
  border-radius: 14px;
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-konten h2 { margin-top: 0; font-size: 1.25rem; }
.modal-konten form { display: flex; flex-direction: column; gap: 12px; }
.modal-konten label { font-size: 0.85rem; color: var(--teks-redup); display: flex; flex-direction: column; gap: 4px; }
.modal-konten input, .modal-konten select {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--garis);
  background: var(--bg);
  color: var(--teks);
  font: inherit;
}
.modal-aksi { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.btn-batal { background: transparent; border: 1px solid var(--garis); color: var(--teks); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.btn-simpan { background: var(--aksen); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<div class="wadah">
  <header>
    <div>
      <h1>Teknik Komputer dan Jaringan</h1>
      <p>Kelola data siswa dan guru.</p>
    </div>
    <button class="btn-tambah" onclick="bukaModalBaru()">+ Tambah Data</button>
  </header>

  <div class="kontrol">
    <input id="cari" type="search" placeholder="Cari nama atau NIS/NIP" aria-label="Cari nama atau NIS">
    <select id="filterRole" aria-label="Filter role">
      <option value="">Semua (Guru / Siswa)</option>
      <option value="siswa">Siswa</option>
      <option value="guru">Guru</option>
    </select>
    <select id="filterKelas" aria-label="Filter kelas">
      <option value="">Semua kelas / mapel</option>
    </select>
  </div>
  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>
</div>

<div id="modalForm" class="modal">
  <div class="modal-konten">
    <h2 id="modalJudul">Tambah Data Baru</h2>
    <form id="formTambah">
      <input type="hidden" id="inputMode" value="tambah">
      <input type="hidden" id="inputOldId" value="">
      
      <label>
        Role
        <select id="inputRole" onchange="sesuaikanForm()">
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
        </select>
      </label>

      <label>
        Nama Lengkap
        <input type="text" id="inputNama" required>
      </label>

      <label id="lblId">
        NIS
        <input type="text" id="inputId" required>
      </label>

      <div id="formSiswaKhusus">
        <label>
          Kelas
          <input type="text" id="inputKelas" placeholder="Contoh: XI TKJ 1">
        </label>
        <label>
          Jenis Kelamin
          <select id="inputJK">
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </label>
        <label>
          Tanggal Lahir
          <input type="date" id="inputTanggal">
        </label>
        <label>
          Alamat
          <input type="text" id="inputAlamat">
        </label>
      </div>

      <div id="formGuruKhusus" style="display: none;">
        <label>
          Jurusan
          <input type="text" id="inputJurusan" value="Teknik Komputer Jaringan">
        </label>
        <label>
          Mata Pelajaran
          <input type="text" id="inputMapel" placeholder="Contoh: Admin Jaringan">
        </label>
      </div>

      <label>
        URL Foto (Optional)
        <input type="url" id="inputFoto" placeholder="https://...">
      </label>

      <div class="modal-aksi">
        <button type="button" class="btn-batal" onclick="tutupModal()">Batal</button>
        <button type="submit" class="btn-simpan">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// --- KONFIGURASI SUPABASE ---
const SUPABASE_URL = "https://aqhzzmahvcjiaxsifniu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaHp6bWFodmNqaWF4c2lmbml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODk0NjUsImV4cCI6MjEwNzQ2NTQ2NX0.VffLXkPpn8PS7lI2iV9LQT9KRmnrk0RRMsAhkJ_4RqY";

const TAMPILKAN = {
  jenisKelamin: true,
  tanggalLahir: true,
  alamat: true,
  foto_url: true
};

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elRole = document.getElementById("filterRole");
const elKelas = document.getElementById("filterKelas");
let semuaData = [];

async function muatData() {
  tampilkanPesan("Memuat data...");
  let gabungan = [];

  const { data: dataSiswa, error: errSiswa } = await db
    .from("siswa")
    .select("*")
    .order("nama");

  if (errSiswa) {
    console.error("Error Siswa:", errSiswa.message);
  } else if (dataSiswa) {
    gabungan = gabungan.concat(dataSiswa.map(s => ({ ...s, role: "siswa" })));
  }

  try {
    const { data: dataGuru, error: errGuru } = await db
      .from("guru")
      .select("*")
      .order("nama");

    if (errGuru) {
      console.warn("Error Guru:", errGuru.message);
    } else if (dataGuru) {
      gabungan = gabungan.concat(dataGuru.map(g => ({ ...g, role: "guru" })));
    }
  } catch (e) {
    console.warn("Tabel guru error:", e);
  }

  semuaData = gabungan;
  isiPilihanKelas();
  tampilkanSiswa();
}

function tampilkanSiswa() {
  const kataKunci = elCari.value.trim().toLowerCase();
  const roleDipilih = elRole ? elRole.value : "";
  const kelasDipilih = elKelas.value;

  const hasil = semuaData.filter((s) => {
    const cocokRole = !roleDipilih || s.role === roleDipilih;
    const cocokKelas = !kelasDipilih || s.kelas === kelasDipilih || s.mapel === kelasDipilih;
    const nama = (s.nama || "").toLowerCase();
    const id = (s.nis || s.nip || "").toLowerCase();
    const cocokCari = !kataKunci || nama.includes(kataKunci) || id.includes(kataKunci);
    
    return cocokRole && cocokKelas && cocokCari;
  });

  elJumlah.textContent = hasil.length + " dari " + semuaData.length + " data";
  elDaftar.replaceChildren();

  if (hasil.length === 0) {
    tampilkanPesan(semuaData.length === 0 ? "Belum ada data." : "Tidak ada data yang cocok.");
    return;
  }

  hasil.forEach((s) => elDaftar.appendChild(buatKartu(s)));
}

function buatKartu(s) {
  const kartu = el("article", "kartu");
  kartu.appendChild(el("div", "pita"));
  const isi = el("div", "isi");

  const foto = el("div", "foto");
  if (s.foto_url) {
    const gambar = document.createElement("img");
    gambar.src = s.foto_url;
    gambar.alt = "Foto " + s.nama;
    gambar.loading = "lazy";
    gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(s.nama)));
    foto.appendChild(gambar);
  } else {
    foto.textContent = inisial(s.nama);
  }
  foto.title = "Klik untuk memperbesar foto";
      foto.onclick = () => {
        if (s.foto_url) {
          fotoBesar.src = s.foto_url;
          modalFoto.classList.add("aktif");
    }
  };

  isi.appendChild(foto);
  isi.appendChild(el("h2", "nama", s.nama));
  isi.appendChild(el("p", "nis", s.role === "guru" ? ("NIP " + (s.nip || "-")) : ("NIS " + (s.nis || "-"))));

  const rincian = el("dl", "rincian");

  if (s.role === "guru") {
    tambahBaris(rincian, "Jurusan", s.jurusan || "Teknik Komputer Jaringan");
    tambahBaris(rincian, "Mapel", s.mapel);
  } else {
    tambahBaris(rincian, "Kelas", s.kelas);
    if (TAMPILKAN.jenisKelamin && s.jenis_kelamin) tambahBaris(rincian, "Jenis kelamin", s.jenis_kelamin);
    if (TAMPILKAN.tanggalLahir && s.tanggal_lahir) tambahBaris(rincian, "Tanggal lahir", formatTanggal(s.tanggal_lahir));
    if (TAMPILKAN.alamat && s.alamat) tambahBaris(rincian, "Alamat", s.alamat);
  }

  isi.appendChild(rincian);
  kartu.appendChild(isi);

  // Tombol Aksi CRUD (Edit & Hapus)
  const aksi = el("div", "kartu-aksi");
  const btnEdit = el("button", "btn-edit", "Edit");
  btnEdit.onclick = () => bukaModalEdit(s);
  const btnHapus = el("button", "btn-hapus", "Hapus");
  btnHapus.onclick = () => hapusData(s);
  
  aksi.appendChild(btnEdit);
  aksi.appendChild(btnHapus);
  kartu.appendChild(aksi);

  return kartu;
}

function el(tag, kelas, teks) {
  const e = document.createElement(tag);
  if (kelas) e.className = kelas;
  if (teks) e.textContent = teks;
  return e;
}

function tambahBaris(dl, label, nilai) {
  if (!nilai) return;
  const baris = el("div");
  baris.appendChild(el("dt", "", label));
  baris.appendChild(el("dd", "", nilai));
  dl.appendChild(baris);
}

function inisial(nama) {
  return (nama || "").split(" ").filter(Boolean).slice(0, 2).map((k) => k[0].toUpperCase()).join("");
}

function formatTanggal(teks) {
  if (!teks) return "";
  return new Date(teks + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}

function tampilkanPesan(teks, galat) {
  elDaftar.replaceChildren(el("p", "pesan" + (galat ? " galat" : ""), teks));
}

function isiPilihanKelas() {
  const role = elRole ? elRole.value : "";
  elKelas.replaceChildren();

  const optDefault = el("option", "", role === "guru" ? "Semua Mapel" : (role === "siswa" ? "Semua Kelas" : "Semua Kelas / Mapel"));
  optDefault.value = "";
  elKelas.appendChild(optDefault);

  let daftar = [];
  if (role === "siswa") {
    daftar = [...new Set(semuaData.filter(s => s.role === "siswa").map(s => s.kelas).filter(Boolean))];
  } else if (role === "guru") {
    daftar = [...new Set(semuaData.filter(s => s.role === "guru").map(s => s.mapel).filter(Boolean))];
  } else {
    const k = semuaData.filter(s => s.role === "siswa").map(s => s.kelas).filter(Boolean);
    const m = semuaData.filter(s => s.role === "guru").map(s => s.mapel).filter(Boolean);
    daftar = [...new Set([...k, ...m])];
  }

  daftar.sort().forEach((k) => {
    const opsi = el("option", "", k);
    opsi.value = k;
    elKelas.appendChild(opsi);
  });
}

function bukaModalBaru() {
  document.getElementById("modalJudul").textContent = "Tambah Data Baru";
  document.getElementById("inputMode").value = "tambah";
  document.getElementById("formTambah").reset();
  document.getElementById("inputRole").disabled = false;
  sesuaikanForm();
  document.getElementById("modalForm").classList.add("aktif");
}

function bukaModalEdit(s) {
  document.getElementById("modalJudul").textContent = "Edit Data";
  document.getElementById("inputMode").value = "edit";
  document.getElementById("inputRole").value = s.role;
  document.getElementById("inputRole").disabled = true; // Kunci role saat edit
  
  sesuaikanForm();

  if (s.role === "siswa") {
    document.getElementById("inputId").value = s.nis || "";
    document.getElementById("inputOldId").value = s.nis || "";
    document.getElementById("inputNama").value = s.nama || "";
    document.getElementById("inputKelas").value = s.kelas || "";
    document.getElementById("inputJK").value = s.jenis_kelamin || "Laki-laki";
    document.getElementById("inputTanggal").value = s.tanggal_lahir || "";
    document.getElementById("inputAlamat").value = s.alamat || "";
  } else {
    document.getElementById("inputId").value = s.nip || "";
    document.getElementById("inputOldId").value = s.nip || "";
    document.getElementById("inputNama").value = s.nama || "";
    document.getElementById("inputJurusan").value = s.jurusan || "Teknik Komputer Jaringan";
    document.getElementById("inputMapel").value = s.mapel || "";
  }

  document.getElementById("inputFoto").value = s.foto_url || "";
  document.getElementById("modalForm").classList.add("aktif");
}

function tutupModal() {
  document.getElementById("modalForm").classList.remove("aktif");
  document.getElementById("formTambah").reset();
  document.getElementById("inputRole").disabled = false;
  sesuaikanForm();
}

function sesuaikanForm() {
  const role = document.getElementById("inputRole").value;
  const formSiswa = document.getElementById("formSiswaKhusus");
  const formGuru = document.getElementById("formGuruKhusus");
  const lblId = document.getElementById("lblId");

  if (role === "guru") {
    formSiswa.style.display = "none";
    formGuru.style.display = "block";
    lblId.childNodes[0].textContent = "NIP ";
  } else {
    formSiswa.style.display = "block";
    formGuru.style.display = "none";
    lblId.childNodes[0].textContent = "NIS ";
  }
}

document.getElementById("formTambah").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mode = document.getElementById("inputMode").value;
  const role = document.getElementById("inputRole").value;
  const nama = document.getElementById("inputNama").value.trim();
  const idVal = document.getElementById("inputId").value.trim();
  const oldId = document.getElementById("inputOldId").value.trim();
  const foto = document.getElementById("inputFoto").value.trim() || null;

  if (role === "siswa") {
    const tgl = document.getElementById("inputTanggal").value;
    const payload = {
      nis: idVal,
      nama: nama,
      kelas: document.getElementById("inputKelas").value.trim() || null,
      jenis_kelamin: document.getElementById("inputJK").value,
      tanggal_lahir: tgl ? tgl : null,
      alamat: document.getElementById("inputAlamat").value.trim() || null,
      foto_url: foto
    };

    if (mode === "tambah") {
      const { error } = await db.from("siswa").insert([payload]);
      if (error) { alert("Gagal menambah siswa: " + error.message); return; }
    } else {
      const { error } = await db.from("siswa").update(payload).eq("nis", oldId);
      if (error) { alert("Gagal memperbarui siswa: " + error.message); return; }
    }
  } else {
    const payload = {
      nip: idVal,
      nama: nama,
      jurusan: document.getElementById("inputJurusan").value.trim() || null,
      mapel: document.getElementById("inputMapel").value.trim() || null,
      foto_url: foto
    };

    if (mode === "tambah") {
      const { error } = await db.from("guru").insert([payload]);
      if (error) { alert("Gagal menambah guru: " + error.message); return; }
    } else {
      const { error } = await db.from("guru").update(payload).eq("nip", oldId);
      if (error) { alert("Gagal memperbarui guru: " + error.message); return; }
    }
  }

  alert("Data berhasil " + (mode === "tambah" ? "ditambahkan" : "diperbarui") + "!");
  tutupModal();
  muatData();
});

async function hapusData(s) {
  const konfirmasi = confirm(`Apakah Anda yakin ingin menghapus ${s.nama}?`);
  if (!konfirmasi) return;

  if (s.role === "siswa") {
    const { error } = await db.from("siswa").delete().eq("nis", s.nis);
    if (error) {
      alert("Gagal menghapus siswa: " + error.message);
      return;
    }
  } else {
    const { error } = await db.from("guru").delete().eq("nip", s.nip);
    if (error) {
      alert("Gagal menghapus guru: " + error.message);
      return;
    }
  }

  alert("Data berhasil dihapus!");
  muatData();
}

elRole.addEventListener("change", () => {
  isiPilihanKelas();
  tampilkanSiswa();
});
elCari.addEventListener("input", tampilkanSiswa);
elKelas.addEventListener("change", tampilkanSiswa);
muatData();
</script>
</body>
  </html>
